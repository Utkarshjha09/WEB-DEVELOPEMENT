<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border=""> <!-- ye border css ka part h -->
        <caption>MOVIE LIST</caption>  <!-- It tell about the heading of the table-->
        <tr>  <!-- Ye row banane ke liye use hota hai-->
            <th>Name</th> <!-- isse hum column banate hai and by default woh black set hot hai yaha humne 3 column bnaya hai row one ke andar -->
            <th>Genre</th>
            <th>Rating</th>
        </tr>
        <tr>
            <td>Golmaal</td> <!-- row ke andar data bhar rhe h  woh be row 1-colum 1 -->
            <td>Comedy</td> <!--ye data row 1 column 2 mai jayega-->
            <td>7.5</td> <!-- ye data  row 1 column 3 mai jayega -->
        </tr>
        <tr>
            <td>Dhurandar</td> <!-- row 2 ke andar data bhar rhe h  woh be row 2-colum 1 -->
            <td>Biopic</td> <!-- ye data  row 2 column 2 mai jayega -->
            <td>9.1</td><!-- ye data  row 2 column 3 mai jayega -->
        </tr>
        <tr>
            <td>Iron Man</td>
            <td>Action</td>
            <td>9.3</td>
        </tr>
        <tr>
            <td>Stranger Things</td>
            <td>Sci-Fi</td>
            <td>9.5</td>
        </tr>
        <tr>
            <td>Premalu</td>
            <td>Romance</td>
            <td>8.8</td>
        </tr>
    </table> <!-- yaha close ho gya hai hai table-->
</body>
</html>
