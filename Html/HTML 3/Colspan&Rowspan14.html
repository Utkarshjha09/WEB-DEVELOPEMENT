<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="">
        <thead>
            <Caption>FOOD MENU</Caption> 
            <tr><!-- yaha row create kar rhe hai -->
                <th rowspan="2">Item</th> <!-- Yaha item jo hai woh 2 row ki jagah leraha hai --> <!---------- do column ka name de rhe hai ----->
                <th colspan="2">Price</th> <!-- Yaha price jo hai woh 2 column ki jagah leraha hai -->
            </tr>
            <tr>
                <th>INR</th> <!--- Yaha row 2 mai column create kar rhe hai -->
                <th>USD</th>
            </tr>
        </thead> <!-- ab yaha header ka koi kaam nhi header close kar denge yaha -->
        <tbody>
            <tr>
                <td>Frooti</td> <!-- data input kar rhe hai ya by using <td> tag  in all columns of single row by row by row operation-->
                <td>10</td>
                <td>0.14</td>
            </tr>
             <tr>
                <td>Samosa</td>
                <td>12</td>
                <td>0.17</td>
            </tr>
             <tr>
                <td>Chips</td>
                <td>20</td>
                <td>0.28</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
