<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <h1>Alert</h1>
    <div class="alert alert-danger"> Download failed ! Please Try again </div>
    <div class="alert alert-success alert-dismissible"> Congratulation! Your score is 50/50.<button class="btn-close" data-bs-dismiss="alert"></button></div>  <!-- Yaha humne button toh create kar liya but  woh sahi positioned nhi hai toh ab humm yaha class mai add karenge "alert-dismissible" and woh cross karne pe alert chale jaye iske liye use karunga 
    use karunga 'data-bs-dismiss="alert" ' iss se woh work karne lagega yeh javascript ki functionality hai -->
</body>
</html>
