<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Component</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" >
</head>
<body>
    <p>Just badge </p>
    <!-- Just badge kaise create karte hai-->
    <span class="badge bg-secondary">new</span>
    <br>
    <span class="badge bg-danger">10+</span>
    <!-- badge ko heading ka saath use karna-->
    <p>heading ke saath v use karskate hai bas span ko add kar denaa heading ke aandar </p>
    <h1>Notification<span class="badge bg-secondary">20+</span></h1>
    <h2>Example heading <span class="badge bg-danger">New</span></h2>

    <p>Badge along with button</p>
    <!--Just humko span add kar denaa hai in between button tags-->
    <button class="btn rounded-pill btn-warning">Notifications <span class="badge bg-primary">4+</span></button> <!--Here we have added rounded-pill keyword inside the class of button that why button is rounded-->
    <p><b> badge </b></p>
    <button class="btn btn-primary position-relative">Inbox<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">99+</span> <!--Here we have added a keyword that is rounded-pill in the class of span  thats why the badge is rounded pill-->
    <br>
    <button class="btn btn-primary position-relative">Profile<span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"></span> <!-- Here also we have a word that is rounded-circle in the class of span that why badge is rounded-->
</button>
</button>
</body>
</html>
