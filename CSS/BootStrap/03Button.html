<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Types Of Button</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" >
</head>
<body>
    <p> For more types visit documentation https://getbootstrap.com/docs/5.3/components/buttons/ </p>
    <button class="btn">Btn 1 </button> <!-- Here it is simple button we need to apply css-->
    <button class="btn btn-danger">btn 2</button> <!-- Here it is by bootstrap we dont have any need to define css-->
    <button class="btn btn-primary">btn 3</button>
    <button class="btn btn-secondary">btn 4</button>
    <button class="btn btn-success">btn 5</button>
    <button class="btn btn-danger">btn 6</button>
    <button class="btn btn-warning">btn 7</button>
    <button class="btn btn-info">btn 8</button>
    <button class="btn btn-light">btn 9</button>
    <button class="btn btn-dark">btn 10</button>
    <button class="btn btn-link">btn 11</button>
    <a href="https://Utkarshjha.me" class="btn">Get in Touch</a>  <!-- Ab yaha humne anchor tag ko class= "btn" de diyaa so bootstrap ke according css apply ho jayegi-->

    <p>Want to create a disable button - use "disable" keyword in class </p>
    <div class="btn btn-success disabled">get in</div> <!-- For disable a button use "disable" keyword in class-->
    <p>Generate Outline buttons- use "outline" keyword in class. </p>
    <button class="btn btn-outline-primary">Primary</button>
    <button class="btn btn-outline-secondary">Secondary</button>
    <button class="btn btn-outline-success">Success</button>
    <button class="btn btn-outline-danger">Danger</button>
    <button class="btn btn-outline-warning">Warning</button>
    <button class="btn btn-outline-info">Info</button>
    <button class="btn btn-outline-light">Light</button>
    <button class="btn btn-outline-dark">Dark</button>
</body>
</html>
