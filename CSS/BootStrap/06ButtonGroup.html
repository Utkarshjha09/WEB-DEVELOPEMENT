<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Group </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" >
</head>
<body>
        <H2>Normal 3-button alag-alag define karenge</H2>
    <div class="container">
        <button class="btn btn-success">Left</button>
        <button class="btn btn-success">Middle</button>
        <button class="btn btn-success">Right</button>
    </div>

    <h2> Yaha Group mai button define kiye hai same </h2>
    <div class="btn-group" >
        <button class="btn btn-success">Left</button>
        <button class="btn btn-success">Middle</button>
        <button class="btn btn-success">Right</button>
    </div>

    <h2> yaha "outline" word se aaya naya UI effect or we say better version aa jayegaa</h2>
    <div class="btn-group" >
        <button class="btn btn-outline-success">one</button>
        <button class="btn btn-outline-success">two</button>
        <button class="btn btn-outline-success">three</button>
    </div>
</body>
</html>
