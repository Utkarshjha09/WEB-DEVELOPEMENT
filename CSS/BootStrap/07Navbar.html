<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" >
    <title>Navbar</title>
</head>
<body>
    <nav class="navbar bg-primary fixed-top navbar-expand-lg" data-bs-theme="dark"> <!-- "navbar-expand-md" md matlab medium screen and lg means large screen fixed-top is used to set the position (fix kar diya page ke top pe  )-->
        <div class="container-fluid">
            <a href="#" class="navbar-brand">Brand Name</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"> <!--javascript function hai -->
                    <span class="navbar-toggler-icon"></span> <!-- yaha humne icon use kar liya hai jo bootstrap mai pehle se defined hai-->
            </button>
            <!-- yaha humne id define kiya hai kyuki humne upar target diya hai button ko (data-bs-target="#navbarNavAltMarkup") yeh div ko collapse hone ke baad open kare toggle icon par click ke baad -->
            </div>
            <form class="d-flex" >
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-outline-light" type="submit">Search</button>
            </form>
        </div>
    </nav>
</body>
</html>
