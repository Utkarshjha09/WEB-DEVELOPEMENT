<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Grid Template(repeat(count, 1fr)) </title>
    <link rel="stylesheet" href="03GridTemplate(Repeat).css">
</head>
<body>
    <h1>Grid Playground - when we use repeat</h1>
    <p>Basically we use it as grid-template-rows/grid-template-columns:(count,1fr) <br>
        where count means no of rows and columns we required. And 1fr means for making that in equal parts./p>
    <div id="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>    
    </div>
</body>
</html>
