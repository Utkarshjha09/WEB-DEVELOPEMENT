<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Grid Template</title>
    <link rel="stylesheet" href="02GridTemplate.css">
</head>
<body>
    <h1>Grid Playground - when Only Grid template row is defined</h1>
    <div id="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>    
    </div>
    <h1>Grid Playground when row and column both are defined</h1>
    <div id="container2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>    
    </div>
    <h1>Grid Playground when not defining the inner width and height</h1>
    <div id="container3">
        <div class="item2">1</div>
        <div class="item2">2</div>
        <div class="item2">3</div>
        <div class="item2">4</div>
        <div class="item2">5</div>    
    </div>
</body>
</html>
