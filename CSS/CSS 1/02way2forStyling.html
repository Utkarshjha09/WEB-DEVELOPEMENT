<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Chapter 1</title>
    <!-- way 2 mai hum ek hie baar head mai style define kar dete hai  like here h1 ke liye ab kahi bhi "h1"
     type ki heading use hogi toh yeh style by default apply ho jayegii -->
    <style> 
        h1{
            color: red;
            background : yellow;
        }
    </style>
</head>
<body>
    <!--Inline Style-->     
    <!-- means hum aise single single v likh sakte hai but ek document mai bahut sare html headings hote hai toh humko har baar ja jake yeh likhna possible nhi hai-->
    <!-- in that case we uses the "Style tag" jaha pe hum ek hie baar style define karte hai kisi bhi ke liye   -->
    <h1>APNA COLLEGE</h1>
    <h1>Utkarsh jha</h1>
    <h1>Hello World</h1>
    <p1>This is my first css programme</p1>
    <button>Help</button>

     
</body>
</html>
